ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.6.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.1.5'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.5.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.aelixto.gamnative"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation project(':capacitor-android')
    // Google Mobile Ads SDK (includes Ad Manager APIs).
    implementation 'com.google.android.gms:play-services-ads:23.5.0'
    // Google User Messaging Platform (UMP) — Google-certified CMP.
    implementation 'com.google.android.ump:user-messaging-platform:3.0.0'
    // Image loading for the native ad icon (already used transitively by many
    // Android apps; declared explicitly so the plugin is self-contained).
    implementation 'com.squareup.picasso:picasso:2.8'
}

// Diagnostic source-chain proof. This runs against the Java source collection
// Gradle is actually about to compile after `npx cap sync android`, not merely
// against the plugin source in the repository. It fails the build if an old or
// different GamNativePlugin.java has been wired into the Android project.
tasks.withType(JavaCompile).configureEach { compileTask ->
    compileTask.doFirst {
        def marker = 'AELIXTO_GAM_INITIALIZE_2026_08_10_1123'
        def pluginSources = compileTask.source.files.findAll {
            it.name == 'GamNativePlugin.java' && it.path.contains('com/aelixto/gamnative')
        }
        if (pluginSources.size() != 1) {
            throw new GradleException("AELIXTO_GAM_COMPILE_PROOF failed: expected one GamNativePlugin.java, found ${pluginSources.size()}")
        }
        def sourceFile = pluginSources.first()
        if (!sourceFile.getText('UTF-8').contains(marker)) {
            throw new GradleException("AELIXTO_GAM_COMPILE_PROOF failed: marker missing from ${sourceFile.canonicalPath}")
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(sourceFile.bytes)
                .encodeHex()
                .toString()
        println "AELIXTO_GAM_COMPILE_PROOF marker=${marker} source=${sourceFile.canonicalPath} sha256=${digest}"
    }
}